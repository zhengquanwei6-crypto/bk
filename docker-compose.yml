services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-image-generator
    restart: always
    ports:
      - "127.0.0.1:3000:3000" # bind to localhost; nginx proxies in front
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/prod.db}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      KIE_API_KEY: ${KIE_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    volumes:
      # Persist SQLite database across container restarts/upgrades.
      # Using a named volume avoids host UID/GID mismatch with the non-root
      # container user (nextjs:1001).
      - aig_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/api-sources"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  aig_data:
